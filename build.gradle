plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
group = 'dev.ccd'
version = mod_version
base { archivesName = 'ccd-1.21.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories {
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.ithundxr.dev/snapshots' }
}
neoForge {
    version = neo_version
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        gameTestServer { type = 'gameTestServer'; systemProperty 'neoforge.enabledGameTestNamespaces', 'ccd' }
    }
    mods { ccd { sourceSet sourceSets.main } }
}
dependencies {
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    implementation 'net.createmod.ponder:ponder-neoforge:1.0.82+mc1.21.1'
    implementation 'com.tterrag.registrate:Registrate:MC1.21-1.3.0+67'
    compileOnly 'dev.engine-room.flywheel:flywheel-neoforge-api-1.21.1:1.0.6'
    runtimeOnly 'dev.engine-room.flywheel:flywheel-neoforge-1.21.1:1.0.6'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('processResources') {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand(version: project.version) }
}
