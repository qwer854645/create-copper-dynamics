plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
group = 'dev.ccd'
version = mod_version
base { archivesName = 'ccd-1.21.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories {
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://maven.terraformersmc.com/releases' }
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://maven.latvian.dev/releases' }
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.ithundxr.dev/snapshots' }
}
neoForge {
    version = neo_version
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        gameTestServer {
            type = 'gameTestServer'; systemProperty 'neoforge.enabledGameTestNamespaces', 'ccd'
            if (project.hasProperty('kjsProbe')) systemProperty 'ccd.kjsProbe', 'true'
            if (project.hasProperty('ccdBenchmark')) systemProperty 'ccd.benchmark', 'true'
            if (project.hasProperty('gluingBaseline')) systemProperty 'ccd.gluingBaseline', 'true'
            if (project.hasProperty('deviceMeasurements')) systemProperty 'ccd.deviceMeasurements', 'true'
            if (project.hasProperty('syncBaseline')) systemProperty 'ccd.syncBaseline', 'true'
        }
    }
    mods { ccd { sourceSet sourceSets.main } }
}
dependencies {
    if (project.hasProperty('pnpJar')) {
        compileOnly files(project.property('pnpJar'))
    } else {
        compileOnly 'maven.modrinth:create-pipes-n-physics:3.2.1'
    }
    compileOnly 'mezz.jei:jei-1.21.1-common-api:19.21.0.247'
    compileOnly 'mezz.jei:jei-1.21.1-neoforge-api:19.21.0.247'
    compileOnly 'dev.emi:emi-neoforge:1.1.24+1.21.1:api'
    compileOnly 'dev.latvian.mods:kubejs-neoforge:2101.7.2-build.382'
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    implementation 'net.createmod.ponder:ponder-neoforge:1.0.82+mc1.21.1'
    implementation 'com.tterrag.registrate:Registrate:MC1.21-1.3.0+67'
    compileOnly 'dev.engine-room.flywheel:flywheel-neoforge-api-1.21.1:1.0.6'
    compileOnly 'dev.engine-room.flywheel:flywheel-neoforge-1.21.1:1.0.6'
    runtimeOnly 'dev.engine-room.flywheel:flywheel-neoforge-1.21.1:1.0.6'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('processResources') {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand(version: project.version) }
}
